upstream smokerkhata_app {
    server unix:/run/smokerkhata/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name smokerkhata.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smokerkhata.example.com;

    ssl_certificate /etc/letsencrypt/live/smokerkhata.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smokerkhata.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Static assets served directly
    location /static/ {
        alias /var/www/smokerkhata/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://smokerkhata_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://smokerkhata_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
